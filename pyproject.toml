[project]
name = "teams-sdk-maf-sample"
version = "0.1.0"
description = "Community sample for Microsoft Teams SDK transport with a replaceable Agent Framework engine"
readme = "README.md"
requires-python = ">=3.11,<4.0"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["azure", "microsoft-agent-framework", "microsoft-teams", "streaming"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "agent-framework-core==1.11.0",
    "agent-framework-openai==1.10.1",
    "azure-data-tables==12.7.0",
    "azure-identity==1.25.3",
    "azure-monitor-opentelemetry==1.8.9",
    "azure-storage-blob==12.30.0",
    "httpx==0.28.1",
    "microsoft-teams-apps[graph]==2.0.14",
    "pillow==12.3.0",
    "pydantic-settings==2.15.0",
    "tenacity==9.1.4",
]

[dependency-groups]
dev = [
    "pyright==1.1.411",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.15.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "basic"
strict = ["src"]
pythonVersion = "3.11"
reportMissingTypeStubs = false
