---
name: CI

"on":
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          version: 0.9.24
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest -q

  quality:
    name: Repository quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          version: 0.9.24
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Lint Python
        run: uv run ruff check .

      - name: Type-check Python
        run: uv run pyright

      - name: Build Python package
        run: uv build --out-dir dist

      - name: Check shell syntax
        run: bash -n scripts/*.sh

      - name: Compile Bicep
        run: az bicep build --file infra/main.bicep --stdout >/dev/null

      - name: Lint Markdown
        run: npx -y markdownlint-cli2@0.20.0 '*.md' 'docs/*.md'

      - name: Audit locked runtime dependencies
        run: |
          uv export --frozen --no-dev --no-hashes --no-emit-project \
            --format requirements-txt --output-file /tmp/runtime-requirements.txt
          uvx --from pip-audit==2.10.1 pip-audit \
            --requirement /tmp/runtime-requirements.txt
